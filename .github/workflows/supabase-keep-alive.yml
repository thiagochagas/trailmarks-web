name: Supabase Keep-Alive

# O plano gratuito do Supabase pausa o projeto após 7 dias sem atividade
# real de banco (não basta um ping de health-check — precisa ser uma
# consulta que toque uma tabela via PostgREST). Rodar 2x por semana fica
# bem dentro dessa janela.
on:
  schedule:
    - cron: "0 12 * * 1,4" # segunda e quinta, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar tabela real via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /tmp/resposta.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/viagens?select=*&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $status"
          cat /tmp/resposta.json

          if [ "$status" -ge 400 ]; then
            echo "Supabase respondeu com erro ($status) — verifique os secrets SUPABASE_URL/SUPABASE_ANON_KEY."
            exit 1
          fi
